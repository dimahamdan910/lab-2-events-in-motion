<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Interactive Mood Page</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <h1 id="title">Interactive Mood Page</h1>

    <p id="message">
      Use the buttons, mouse, keyboard, and browser window to interact with the page.
    </p>

    <div class="button-area">
      <button id="colorButton">Change Mood</button>
      <button id="textButton">Change Message</button>
    </div>

    <div id="box">
      Hover over me!
    </div>

    <div class="info">
      <p>
        Press <strong>D</strong> to turn dark mode on or off.
      </p>

      <p id="windowSize"></p>
    </div>

    <p id="status">
      Try interacting with the page!
    </p>

  </main>

  <script src="script.js"></script>

</body>
</html>
